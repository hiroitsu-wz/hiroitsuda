<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PUYOichi Realtime Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; }
      body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; height: 100dvh; }
      #ui-overlay { position: absolute; inset: 0; z-index: 1000; background: rgba(15,23,42,0.9); display: flex; justify-content: center; align-items: center; }
      .modal { background: var(--panel); padding: 20px; border-radius: 15px; text-align: center; width: 80%; max-width: 300px; }
      .battle-container { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
      canvas { background: #000; border: 2px solid #334155; border-radius: 5px; width: 160px; height: 320px; }
      .my-field canvas { border-color: var(--accent); }
      .ctrl-area { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; width: 100%; max-width: 400px; }
      .btn { background: #334155; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; }
      .btn:active { background: #475569; }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div id="view-connect" class="modal">
        <h3>対戦待機中</h3>
        <p id="my-id-display">ID発行中...</p>
        <input type="tel" id="target-id" placeholder="相手のIDを入力" style="width:80%; padding:8px; margin-bottom:10px;">
        <button class="btn" id="connect-btn" style="width:100%">接続</button>
      </div>
      <div id="view-ready" class="modal" style="display:none">
        <button class="btn" id="ready-btn" style="width:100%">準備完了</button>
      </div>
    </div>

    <div class="battle-container">
      <div class="field-wrapper my-field">
        <div id="my-ojama-bar" style="height:20px; color:red; font-size:12px;"></div>
        <canvas id="my-canvas" width="240" height="480"></canvas>
        <div>YOU: <span id="my-score">0</span></div>
      </div>
      <div class="field-wrapper">
        <div id="enemy-ojama-bar" style="height:20px; color:red; font-size:12px;"></div>
        <canvas id="enemy-canvas" width="240" height="480"></canvas>
        <div>ENEMY: <span id="enemy-score">0</span></div>
      </div>
    </div>

    <div class="ctrl-area">
      <button class="btn" onclick="handleInput('rotL')">左回転</button>
      <button class="btn" onclick="handleInput('up')">↑</button>
      <button class="btn" onclick="handleInput('rotR')">右回転</button>
      <button class="btn" onclick="handleInput('left')">←</button>
      <button class="btn" onclick="handleInput('down')">↓</button>
      <button class="btn" onclick="handleInput('right')">→</button>
    </div>

    <script>
      // サウンド設定
      const sounds = {
        pop: new Audio('puyo_pop.mp3'),
        move: new Audio('puyo_move.mp3'),
        rotate: new Audio('puyo_rotate.mp3'),
        button: new Audio('puyo_button.mp3'),
        set: new Audio('puyo_set.mp3')
      };
      function play(key) { 
        if(sounds[key]) {
          sounds[key].currentTime = 0;
          sounds[key].play().catch(() => {});
        }
      }

      let peer, conn, myID = Math.floor(1e8 + Math.random() * 9e7).toString();
      let board, enemyBoard, activePuyo, enemyActivePuyo, score=0, enemyScore=0, myOjama=0, enemyOjama=0;
      let gameActive = false, isProcessing = false;
      const ROWS=12, COLS=6, SIZE=40;
      const COLORS = [null, "#ff4b4b", "#4bff4b", "#4b4bff", "#ffff4b", "#ff4bff"];

      const myCanvas = document.getElementById("my-canvas"), myCtx = myCanvas.getContext("2d");
      const enemyCanvas = document.getElementById("enemy-canvas"), enemyCtx = enemyCanvas.getContext("2d");

      function initPeer() {
        peer = new Peer(myID);
        peer.on('open', id => document.getElementById("my-id-display").innerText = "ID: " + id);
        peer.on('connection', c => { conn = c; setupConn(); });
      }

      document.getElementById("connect-btn").onclick = () => {
        play('button');
        const tid = document.getElementById("target-id").value;
        if(tid) { conn = peer.connect(tid); setupConn(); }
      };

      function setupConn() {
        conn.on('open', () => {
          document.getElementById("view-connect").style.display = "none";
          document.getElementById("view-ready").style.display = "block";
        });
        conn.on('data', data => {
          if(data.type === "START") startGame();
          if(data.type === "SYNC") {
            enemyBoard = data.board;
            enemyActivePuyo = data.active;
            enemyScore = data.score;
            enemyOjama = data.ojama;
            drawEnemy();
          }
          if(data.type === "ATTACK") { myOjama += data.amount; updateOjamaUI(); }
        });
      }

      document.getElementById("ready-btn").onclick = () => {
        play('button');
        conn.send({type: "START"});
        startGame();
      };

      function startGame() {
        document.getElementById("ui-overlay").style.display = "none";
        board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        enemyBoard = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        score = 0; myOjama = 0;
        spawnPuyo();
        gameActive = true;
        requestAnimationFrame(renderLoop);
        setInterval(gravityTick, 800);
      }

      function spawnPuyo() {
        activePuyo = { x:2, y:0, rot:0, c1:Math.floor(Math.random()*5)+1, c2:Math.floor(Math.random()*5)+1 };
        if(!canMove(0,0,0)) gameActive = false; // Game Over
        sync();
      }

      function canMove(dx, dy, dr) {
        const nr = (activePuyo.rot + dr + 4) % 4;
        const ox = [0, 1, 0, -1][nr], oy = [-1, 0, 1, 0][nr];
        const pts = [{x: activePuyo.x+dx, y: activePuyo.y+dy}, {x: activePuyo.x+dx+ox, y: activePuyo.y+dy+oy}];
        return pts.every(p => p.x>=0 && p.x<COLS && p.y<ROWS && (p.y<0 || board[p.y][p.x]===0));
      }

      function handleInput(type) {
        if(!gameActive || isProcessing) return;
        if(type === 'left' && canMove(-1,0,0)) { activePuyo.x--; play('move'); }
        if(type === 'right' && canMove(1,0,0)) { activePuyo.x++; play('move'); }
        if(type === 'down' && canMove(0,1,0)) { activePuyo.y++; play('move'); }
        if(type === 'rotR' && canMove(0,0,1)) { activePuyo.rot = (activePuyo.rot+1)%4; play('rotate'); }
        if(type === 'rotL' && canMove(0,0,-1)) { activePuyo.rot = (activePuyo.rot+3)%4; play('rotate'); }
        if(type === 'up') { while(canMove(0,1,0)) activePuyo.y++; }
        sync();
      }

      async function gravityTick() {
        if(!gameActive || isProcessing) return;
        if(canMove(0,1,0)) {
          activePuyo.y++;
          sync();
        } else {
          isProcessing = true;
          lockPuyo();
          await handleChain();
          if(myOjama > 0) await dropOjama();
          spawnPuyo();
          isProcessing = false;
        }
      }

      function lockPuyo() {
        const ox = [0, 1, 0, -1][activePuyo.rot], oy = [-1, 0, 1, 0][activePuyo.rot];
        if(activePuyo.y >= 0) board[activePuyo.y][activePuyo.x] = activePuyo.c1;
        if(activePuyo.y+oy >= 0) board[activePuyo.y+oy][activePuyo.x+ox] = activePuyo.c2;
        play('set');
      }

      async function handleChain() {
        let chain = 1;
        while(true) {
          // 落下
          let dropped = true;
          while(dropped) {
            dropped = false;
            for(let y=ROWS-2; y>=0; y--) {
              for(let x=0; x<COLS; x++) {
                if(board[y][x] && !board[y+1][x]) { board[y+1][x]=board[y][x]; board[y][x]=0; dropped=true; }
              }
            }
            if(dropped) { sync(); await new Promise(r => setTimeout(r, 100)); }
          }
          // 消去判定
          const matches = findMatches();
          if(matches.length === 0) break;
          
          play('pop');
          matches.forEach(p => board[p.y][p.x] = 0);
          score += matches.length * 10 * chain;
          
          // 攻撃送信
          if(matches.length >= 4) {
            conn.send({type: "ATTACK", amount: Math.floor(matches.length / 2)});
          }
          
          chain++;
          sync();
          await new Promise(r => setTimeout(r, 500));
        }
      }

      async function dropOjama() {
        const count = Math.min(myOjama, 30);
        myOjama -= count;
        updateOjamaUI();
        // 簡易的な即時落下（フリーズ防止のため）
        for(let i=0; i<count; i++) {
          let x = i % COLS;
          for(let y=ROWS-1; y>=0; y--) {
            if(board[y][x] === 0) { board[y][x] = 9; break; }
          }
        }
        play('set');
        sync();
      }

      function findMatches() {
        let matched = [];
        let visited = Array.from({length:ROWS}, ()=>Array(COLS).fill(false));
        for(let y=0; y<ROWS; y++) {
          for(let x=0; x<COLS; x++) {
            if(board[y][x] && board[y][x]!==9 && !visited[y][x]) {
              let group = [], color = board[y][x], stack = [{x,y}];
              while(stack.length) {
                let curr = stack.pop();
                if(curr.x<0||curr.x>=COLS||curr.y<0||curr.y>=ROWS||visited[curr.y][curr.x]||board[curr.y][curr.x]!==color) continue;
                visited[curr.y][curr.x] = true; group.push(curr);
                stack.push({x:curr.x+1,y:curr.y},{x:curr.x-1,y:curr.y},{x:curr.x,y:curr.y+1},{x:curr.x,y:curr.y-1});
              }
              if(group.length >= 4) matched.push(...group);
            }
          }
        }
        return matched;
      }

      function sync() {
        if(conn && conn.open) {
          conn.send({
            type: "SYNC",
            board: board,
            active: activePuyo,
            score: score,
            ojama: myOjama
          });
        }
      }

      function renderLoop() {
        myCtx.clearRect(0,0,240,480);
        board.forEach((r,y)=>r.forEach((v,x)=> { if(v) drawPuyo(myCtx,x,y,v); }));
        if(activePuyo && !isProcessing) {
          const ox = [0,1,0,-1][activePuyo.rot], oy = [-1,0,1,0][activePuyo.rot];
          drawPuyo(myCtx, activePuyo.x, activePuyo.y, activePuyo.c1);
          drawPuyo(myCtx, activePuyo.x+ox, activePuyo.y+oy, activePuyo.c2);
        }
        document.getElementById("my-score").innerText = score;
        requestAnimationFrame(renderLoop);
      }

      function drawEnemy() {
        enemyCtx.clearRect(0,0,240,480);
        enemyBoard.forEach((r,y)=>r.forEach((v,x)=> { if(v) drawPuyo(enemyCtx,x,y,v); }));
        if(enemyActivePuyo) {
          const a = enemyActivePuyo;
          const ox = [0,1,0,-1][a.rot], oy = [-1,0,1,0][a.rot];
          drawPuyo(enemyCtx, a.x, a.y, a.c1);
          drawPuyo(enemyCtx, a.x+ox, a.y+oy, a.c2);
        }
        document.getElementById("enemy-score").innerText = enemyScore;
        updateOjamaUI();
      }

      function drawPuyo(ctx, x, y, v) {
        if(y<0) return;
        ctx.fillStyle = v === 9 ? "#999" : COLORS[v];
        ctx.beginPath();
        ctx.arc(x*SIZE + SIZE/2, y*SIZE + SIZE/2, SIZE/2-2, 0, Math.PI*2);
        ctx.fill();
      }

      function updateOjamaUI() {
        document.getElementById("my-ojama-bar").innerText = "▲".repeat(myOjama);
        document.getElementById("enemy-ojama-bar").innerText = "▲".repeat(enemyOjama);
      }

      initPeer();
    </script>
  </body>
</html>
