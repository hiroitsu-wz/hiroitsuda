<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PUYOichi Online Ultimate</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      /* スタイル設定（既存のもの） */
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; touch-action: none; color: white; font-family: "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; }
      .moon { position: absolute; width: 400px; height: 200px; filter: blur(60px); z-index: -1; opacity: 0.2; border-radius: 50%; top: -50px; right: -100px; background: linear-gradient(to bottom, #38bdf8, #818cf8); }
      #ui-overlay { position: absolute; inset: 0; z-index: 1000; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; }
      .modal { background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #334155; width: 85%; max-width: 320px; text-align: center; }
      input { padding: 12px; font-size: 16px; margin: 8px 0; width: 90%; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; outline: none; }
      .big-btn { margin-top: 10px; width: 100%; background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
      .big-btn:disabled { background: #475569; cursor: not-allowed; }
      .battle-container { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
      .field-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
      canvas { background: rgba(30, 41, 59, 0.95); border: 3px solid #475569; border-radius: 12px; width: 150px; height: 300px; }
      .my-field canvas { border-color: #3b82f6; }
      .next-area { margin-left: 5px; display: flex; flex-direction: column; gap: 8px; }
      .next-box { width: 40px; height: 80px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; display: flex; flex-direction: column; align-items: center; padding: 5px 0; border: 1px solid #334155; }
      .controller { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 95%; max-width: 360px; margin-top: 15px; }
      .ctrl-btn { background: #334155; border: none; border-radius: 12px; color: white; font-size: 24px; padding: 15px 0; touch-action: none; user-select: none; }
      .btn-rot-l { background: #ec4899; }
      .btn-rot-r { background: #8b5cf6; }
      .btn-drop { background: #3b82f6; grid-column: span 4; padding: 10px 0; font-size: 16px; font-weight: bold; }
      .ojama-bar { height: 20px; font-size: 12px; color: #ef4444; font-weight: bold; }
      .match-score { font-size: 24px; color: #facc15; margin: 5px 0; font-weight: 900; }
    </style>
  </head>
  <body>
    <div class="moon"></div>
    <div id="ui-overlay">
      <div id="view-connect" class="modal">
        <h2 style="margin: 0 0 10px 0">PUYOichi Online</h2>
        <p id="my-id-display" style="color: #38bdf8; font-weight: bold">ID発行中...</p>
        <input type="tel" id="target-id" placeholder="相手のIDを入力" />
        <button class="big-btn" id="connect-btn">対戦を申し込む</button>
      </div>
      <div id="view-ready" class="modal" style="display: none">
        <h2 id="ready-status">CONNECTED!</h2>
        <p id="sync-msg" style="color: #94a3b8; font-size: 14px">相手の準備を待っています...</p>
        <button class="big-btn" id="ready-btn">準備完了</button>
      </div>
      <div id="view-result" class="modal" style="display: none">
        <h2 id="result-text">WIN</h2>
        <div id="match-status" class="match-score">★ 0 - 0 ★</div>
        <button class="big-btn" id="next-match-btn" style="display:none">次の試合へ</button>
        <button class="big-btn" id="rematch-btn" onclick="location.reload()" style="display:none">最初からやり直す</button>
      </div>
    </div>

    <div style="margin-top: 10px; font-size: 18px; font-weight: bold; color: #38bdf8;">PUYOichi Ultimate</div>

    <div style="display: flex; gap: 40px; margin-bottom: 5px;">
        <div id="my-stars" style="color: #facc15; font-size: 20px;">☆☆</div>
        <div id="enemy-stars" style="color: #facc15; font-size: 20px;">☆☆</div>
    </div>

    <div class="battle-container">
      <div class="field-wrapper my-field">
        <div id="my-ojama-bar" class="ojama-bar"></div>
        <div style="display: flex; align-items: flex-start">
          <canvas id="my-canvas" width="240" height="480"></canvas>
          <div class="next-area">
            <div class="next-box" id="next1"></div>
            <div class="next-box" id="next2" style="transform: scale(0.8)"></div>
          </div>
        </div>
        <div style="margin-top: 5px">YOU: <span id="my-score">0</span></div>
      </div>
      <div class="field-wrapper">
        <div id="enemy-ojama-bar" class="ojama-bar"></div>
        <canvas id="enemy-canvas" width="240" height="480"></canvas>
        <div style="margin-top: 5px">ENEMY: <span id="enemy-score">0</span></div>
      </div>
    </div>

    <div class="controller">
      <button class="ctrl-btn" id="m-left">←</button>
      <button class="ctrl-btn btn-rot-l" id="m-rot-l">↺</button>
      <button class="ctrl-btn btn-rot-r" id="m-rot-r">↻</button>
      <button class="ctrl-btn" id="m-right">→</button>
      <button class="ctrl-btn btn-drop" id="m-down">QUICK DROP</button>
    </div>

    <script>
      // --- 音声・定数 ---
      const se = {
        pop: new Audio("puyo_pop.mp3"),
        move: new Audio("puyo_move.mp3"),
        rot: new Audio("puyo_rotate.mp3"),
        btn: new Audio("puyo_button.mp3"),
        set: new Audio("puyo_set.mp3"),
      };
      function play(k) { if (se[k]) { se[k].currentTime = 0; se[k].play().catch(() => {}); } }

      let peer, conn, myID = Math.floor(1e8 + Math.random() * 9e7).toString();
      let board, enemyBoard, activePuyo, enemyActivePuyo, score = 0, enemyScore = 0, myOjama = 0, enemyOjama = 0;
      let nextQueue = [], fallingOjamas = [];
      let gameActive = false, isProcessing = false;
      let amIReady = false, isEnemyReady = false;
      
      // 2点先取用変数
      let myWins = 0, enemyWins = 0;
      const WIN_GOAL = 2;

      const myCtx = document.getElementById("my-canvas").getContext("2d");
      const enemyCtx = document.getElementById("enemy-canvas").getContext("2d");
      const ROWS = 12, COLS = 6, SIZE = 40;
      const COLORS = [null, "#ef4444", "#22c55e", "#3b82f6", "#eab308", "#a855f7"];

      peer = new Peer(myID);
      peer.on("open", (id) => (document.getElementById("my-id-display").innerText = "ID: " + id));
      peer.on("connection", (c) => { conn = c; setupConn(); });

      document.getElementById("connect-btn").onclick = () => {
        play("btn");
        const tid = document.getElementById("target-id").value;
        if (tid) { conn = peer.connect(tid); setupConn(); }
      };

      function setupConn() {
        conn.on("open", () => {
          document.getElementById("view-connect").style.display = "none";
          document.getElementById("view-ready").style.display = "block";
        });
        conn.on("data", (data) => {
          if (data.type === "READY_SIGNAL") { isEnemyReady = true; checkStart(); }
          if (data.type === "SYNC") {
            enemyBoard = data.board; enemyActivePuyo = data.active;
            enemyScore = data.score; enemyOjama = data.ojama;
            drawEnemy();
          }
          if (data.type === "ATTACK") { myOjama += data.amount; updateOjamaUI(); }
          if (data.type === "GAMEOVER") endGame("WIN");
          if (data.type === "NEXT_MATCH_READY") { isEnemyReady = true; checkStart(); }
        });
      }

      document.getElementById("ready-btn").onclick = () => {
        play("btn");
        amIReady = true;
        document.getElementById("ready-btn").disabled = true;
        document.getElementById("ready-btn").innerText = "待機中...";
        conn.send({ type: "READY_SIGNAL" });
        checkStart();
      };

      // 次の試合へボタン
      document.getElementById("next-match-btn").onclick = () => {
        play("btn");
        amIReady = true;
        document.getElementById("next-match-btn").disabled = true;
        document.getElementById("next-match-btn").innerText = "相手を待っています...";
        conn.send({ type: "NEXT_MATCH_READY" });
        checkStart();
      };

      function checkStart() {
        if (amIReady && isEnemyReady) {
          amIReady = false; isEnemyReady = false; // フラグリセット
          document.getElementById("next-match-btn").disabled = false;
          document.getElementById("next-match-btn").innerText = "次の試合へ";
          startGame();
        }
      }

      function startGame() {
        document.getElementById("ui-overlay").style.display = "none";
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        enemyBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0; myOjama = 0; fallingOjamas = [];
        nextQueue = Array.from({ length: 3 }, () => ({ c1: rnd(), c2: rnd() }));
        updateStarUI();
        spawnPuyo();
        gameActive = true;
        requestAnimationFrame(renderLoop);
      }

      function rnd() { return Math.floor(Math.random() * 5) + 1; }

      function spawnPuyo() {
        activePuyo = { x: 2, y: 0, rot: 0, ...nextQueue.shift() };
        nextQueue.push({ c1: rnd(), c2: rnd() });
        updateNextUI();
        if (!canMove(0, 0, 0, activePuyo)) {
          endGame("LOSE");
          conn.send({ type: "GAMEOVER" });
        }
        sync();
      }

      // 落下スピード管理用のインターバルを制御
      let gravityInterval = setInterval(() => {
          if (gameActive && !isProcessing) {
            if (canMove(0, 1, 0, activePuyo)) { activePuyo.y++; sync(); } 
            else { lockPuyo(); }
          }
      }, 800);

      function canMove(dx, dy, dr, p) {
        if (!p) return false;
        const nr = (p.rot + dr + 4) % 4;
        const ox = [0, 1, 0, -1][nr], oy = [-1, 0, 1, 0][nr];
        const pts = [{ x: p.x + dx, y: p.y + dy }, { x: p.x + dx + ox, y: p.y + dy + oy }];
        return pts.every(pt => pt.x >= 0 && pt.x < COLS && pt.y < ROWS && (pt.y < 0 || board[pt.y][pt.x] === 0));
      }

      function handleInput(type) {
        if (!gameActive || isProcessing) return;
        if (type === "left" && canMove(-1, 0, 0, activePuyo)) { activePuyo.x--; play("move"); }
        if (type === "right" && canMove(1, 0, 0, activePuyo)) { activePuyo.x++; play("move"); }
        if (type === "down" && canMove(0, 1, 0, activePuyo)) { activePuyo.y++; play("move"); }
        if (type === "rotR") tryRotate(1);
        if (type === "rotL") tryRotate(-1);
        if (type === "up") { while (canMove(0, 1, 0, activePuyo)) activePuyo.y++; lockPuyo(); }
        sync();
      }

      function tryRotate(dr) {
        if (canMove(0, 0, dr, activePuyo)) { activePuyo.rot = (activePuyo.rot + dr + 4) % 4; play("rot"); } 
        else if (canMove(-1, 0, dr, activePuyo)) { activePuyo.x--; activePuyo.rot = (activePuyo.rot + dr + 4) % 4; play("rot"); } 
        else if (canMove(1, 0, dr, activePuyo)) { activePuyo.x++; activePuyo.rot = (activePuyo.rot + dr + 4) % 4; play("rot"); }
      }

      async function lockPuyo() {
        if (isProcessing) return;
        isProcessing = true;
        const ox = [0, 1, 0, -1][activePuyo.rot], oy = [-1, 0, 1, 0][activePuyo.rot];
        if (activePuyo.y >= 0) board[activePuyo.y][activePuyo.x] = activePuyo.c1;
        if (activePuyo.y + oy >= 0) board[activePuyo.y + oy][activePuyo.x + ox] = activePuyo.c2;
        play("set"); activePuyo = null;
        await handleChain();
        if (myOjama > 0) await dropOjamaAnim();
        spawnPuyo();
        isProcessing = false;
      }

      async function handleChain() {
        let chain = 1;
        while (true) {
          let dropped = true;
          while (dropped) {
            dropped = false;
            for (let y = ROWS - 2; y >= 0; y--) {
              for (let x = 0; x < COLS; x++) {
                if (board[y][x] && !board[y + 1][x]) { board[y + 1][x] = board[y][x]; board[y][x] = 0; dropped = true; }
              }
            }
            if (dropped) { sync(); await new Promise((r) => setTimeout(r, 60)); }
          }
          const matches = findMatches();
          if (matches.length === 0) break;
          play("pop");
          matches.forEach((p) => (board[p.y][p.x] = 0));
          score += matches.length * 10 * chain;
          if (matches.length >= 4) conn.send({ type: "ATTACK", amount: Math.floor(matches.length / 2) });
          chain++; sync();
          await new Promise((r) => setTimeout(r, 400));
        }
      }

      async function dropOjamaAnim() {
        let count = Math.min(myOjama, 30); myOjama -= count; updateOjamaUI();
        let currentFalling = [];
        for (let i = 0; i < count; i++) {
          let x = i % 6; let targetY = -1;
          for (let ty = ROWS - 1; ty >= 0; ty--) {
            if (board[ty][x] === 0 && !currentFalling.some((f) => f.x === x && f.targetY === ty)) { targetY = ty; break; }
          }
          if (targetY !== -1) currentFalling.push({ x, y: -2, targetY });
        }
        while (currentFalling.some((f) => f.y < f.targetY)) {
          currentFalling.forEach((f) => { if (f.y < f.targetY) f.y += 0.5; });
          fallingOjamas = currentFalling; sync();
          await new Promise((r) => setTimeout(r, 20));
        }
        currentFalling.forEach((f) => { if (f.targetY >= 0) board[f.targetY][f.x] = 9; });
        fallingOjamas = []; play("set"); sync();
      }

      function findMatches() {
        let matched = []; let visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (board[y][x] && board[y][x] !== 9 && !visited[y][x]) {
              let group = [], color = board[y][x], stack = [{ x, y }];
              while (stack.length) {
                let curr = stack.pop();
                if (curr.x < 0 || curr.x >= COLS || curr.y < 0 || curr.y >= ROWS || visited[curr.y][curr.x] || board[curr.y][curr.x] !== color) continue;
                visited[curr.y][curr.x] = true; group.push(curr);
                stack.push({ x: curr.x + 1, y: curr.y }, { x: curr.x - 1, y: curr.y }, { x: curr.x, y: curr.y + 1 }, { x: curr.x, y: curr.y - 1 });
              }
              if (group.length >= 4) matched.push(...group);
            }
          }
        }
        return matched;
      }

      function sync() { if (conn?.open) conn.send({ type: "SYNC", board, active: activePuyo, score, ojama: myOjama }); }

      function renderLoop() {
        if (!gameActive) return;
        myCtx.clearRect(0, 0, 240, 480);
        board.forEach((r, y) => r.forEach((v, x) => { if (v) drawPuyo(myCtx, x, y, v); }));
        if (activePuyo && !isProcessing) {
          const ox = [0, 1, 0, -1][activePuyo.rot], oy = [-1, 0, 1, 0][activePuyo.rot];
          drawPuyo(myCtx, activePuyo.x, activePuyo.y, activePuyo.c1);
          drawPuyo(myCtx, activePuyo.x + ox, activePuyo.y + oy, activePuyo.c2);
        }
        fallingOjamas.forEach((f) => drawPuyo(myCtx, f.x, f.y, 9));
        document.getElementById("my-score").innerText = score;
        requestAnimationFrame(renderLoop);
      }

      function drawEnemy() {
        enemyCtx.clearRect(0, 0, 240, 480);
        enemyBoard?.forEach((r, y) => r.forEach((v, x) => { if (v) drawPuyo(enemyCtx, x, y, v); }));
        if (enemyActivePuyo) {
          const a = enemyActivePuyo; const ox = [0, 1, 0, -1][a.rot], oy = [-1, 0, 1, 0][a.rot];
          drawPuyo(enemyCtx, a.x, a.y, a.c1); drawPuyo(enemyCtx, a.x + ox, a.y + oy, a.c2);
        }
        document.getElementById("enemy-score").innerText = enemyScore;
        updateOjamaUI();
      }

      function drawPuyo(ctx, x, y, v) {
        if (y < -1 && v !== 9) return;
        ctx.fillStyle = v === 9 ? "#cbd5e1" : COLORS[v];
        ctx.beginPath();
        ctx.arc(x * SIZE + SIZE / 2, y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
        if (v !== 9) {
          ctx.fillStyle = "rgba(255,255,255,0.3)";
          ctx.beginPath();
          ctx.arc(x * SIZE + SIZE / 3, y * SIZE + SIZE / 3, SIZE / 8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateNextUI() {
        [1, 2].forEach((i) => {
          const box = document.getElementById(`next${i}`); const p = nextQueue[i - 1];
          box.innerHTML = `<div style="width:26px; height:26px; border-radius:50%; background:${COLORS[p.c2]}; margin-bottom:4px; border:1px solid rgba(0,0,0,0.2);"></div>
                           <div style="width:26px; height:26px; border-radius:50%; background:${COLORS[p.c1]}; border:1px solid rgba(0,0,0,0.2);"></div>`;
        });
      }

      function updateOjamaUI() {
        const bar = (n) => "●".repeat(Math.min(n, 12)) + (n > 12 ? "+" : "");
        document.getElementById("my-ojama-bar").innerText = bar(myOjama);
        document.getElementById("enemy-ojama-bar").innerText = bar(enemyOjama);
      }

      function updateStarUI() {
          document.getElementById("my-stars").innerText = "★".repeat(myWins) + "☆".repeat(WIN_GOAL - myWins);
          document.getElementById("enemy-stars").innerText = "★".repeat(enemyWins) + "☆".repeat(WIN_GOAL - enemyWins);
      }

      function endGame(res) {
        gameActive = false;
        if (res === "WIN") myWins++; else enemyWins++;
        
        updateStarUI();
        const matchResult = document.getElementById("result-text");
        const matchStatus = document.getElementById("match-status");
        const nextBtn = document.getElementById("next-match-btn");
        const rematchBtn = document.getElementById("rematch-btn");

        matchResult.innerText = res === "WIN" ? "YOU WIN!" : "YOU LOSE...";
        matchStatus.innerText = `${myWins} - ${enemyWins}`;

        if (myWins >= WIN_GOAL || enemyWins >= WIN_GOAL) {
            matchResult.innerText = myWins >= WIN_GOAL ? "👑 MATCH WINNER 👑" : "MATCH OVER...";
            nextBtn.style.display = "none";
            rematchBtn.style.display = "block";
        } else {
            nextBtn.style.display = "block";
            rematchBtn.style.display = "none";
        }

        document.getElementById("view-result").style.display = "block";
        document.getElementById("ui-overlay").style.display = "flex";
      }

      // --- ボタン・キーボード操作の割り当て ---
      const setupBtn = (id, type) => {
        const el = document.getElementById(id);
        el.onpointerdown = (e) => { e.preventDefault(); handleInput(type); };
      };
      setupBtn("m-left", "left");
      setupBtn("m-right", "right");
      setupBtn("m-rot-l", "rotL");
      setupBtn("m-rot-r", "rotR");
      setupBtn("m-down", "up");

      window.onkeydown = (e) => {
        if (e.key === "ArrowLeft") handleInput("left");
        if (e.key === "ArrowRight") handleInput("right");
        if (e.key === "ArrowDown") handleInput("down");
        if (e.key === "ArrowUp") handleInput("rotL"); // 上ボタン：左回転
        if (e.key === "Shift") handleInput("rotR");    // Shiftキー：右回転
        if (e.key === " ") handleInput("up");         // スペース：クイックドロップ
      };
    </script>
  </body>
</html>
