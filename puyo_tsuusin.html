<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PUYOichi Online - Ultimate PvP</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #3b82f6;
        --win: #eab308;
        --danger: #ef4444;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        touch-action: none;
        overflow: hidden;
        height: 100vh;
      }
      #ui-overlay {
        position: absolute;
        inset: 0;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal {
        background: var(--panel);
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        width: 85%;
        max-width: 320px;
        border: 1px solid #334155;
      }
      .battle-container {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      canvas {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #475569;
        border-radius: 8px;
        width: 150px;
        height: 300px;
      }
      .my-field canvas {
        border-color: var(--accent);
        width: 180px;
        height: 360px;
      }
      .ojama-stock {
        height: 24px;
        font-size: 14px;
        text-align: left;
        overflow: hidden;
      }
      .ojama-warning {
        color: var(--danger);
        font-weight: bold;
        animation: blink 0.5s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.5;
        }
      }
      .btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }
      .ctrl-area {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        width: 90%;
        max-width: 300px;
      }
      #countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 80px;
        font-weight: 900;
        z-index: 500;
        pointer-events: none;
      }
      .lamp {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #334155;
        margin: 0 2px;
      }
      .lamp.active {
        background: var(--win);
        box-shadow: 0 0 8px var(--win);
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div id="view-connect" class="modal">
        <h2>PUYOichi Online</h2>
        <div
          id="my-id-display"
          style="font-size: 20px; color: #38bdf8; margin: 10px 0"
        >
          ID発行中...
        </div>
        <input
          type="tel"
          id="target-id"
          placeholder="相手のIDを入力"
          maxlength="10"
          style="
            width: 80%;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            border: none;
          "
        />
        <button class="btn" id="connect-btn">対戦を申し込む</button>
        <div
          id="status-msg"
          style="font-size: 12px; color: var(--danger); margin-top: 5px"
        ></div>
      </div>
      <div id="view-ready" class="modal" style="display: none">
        <h2>READY?</h2>
        <p id="ready-status">相手の接続待ち...</p>
        <button class="btn" id="ready-btn">準備OK！</button>
      </div>
      <div id="view-result" class="modal" style="display: none">
        <h1 id="result-text">WIN</h1>
        <button class="btn" onclick="location.reload()">タイトルへ</button>
      </div>
    </div>

    <div id="countdown"></div>

    <div class="battle-container">
      <div class="field-wrapper my-field">
        <div id="my-lamps">
          <div class="lamp"></div>
          <div class="lamp"></div>
        </div>
        <div class="ojama-stock" id="my-ojama-bar"></div>
        <canvas id="my-canvas" width="240" height="480"></canvas>
        <div id="my-score" style="font-size: 12px">YOU: 0</div>
      </div>
      <div class="field-wrapper">
        <div id="enemy-lamps">
          <div class="lamp"></div>
          <div class="lamp"></div>
        </div>
        <div class="ojama-stock" id="enemy-ojama-bar"></div>
        <canvas id="enemy-canvas" width="240" height="480"></canvas>
        <div id="enemy-score" style="font-size: 12px">ENEMY: 0</div>
      </div>
    </div>

    <div class="ctrl-area">
      <button class="btn" onclick="handleInput('left')">←</button>
      <button
        class="btn"
        style="background: #8b5cf6"
        onclick="handleInput('rot')"
      >
        回転
      </button>
      <button class="btn" onclick="handleInput('right')">→</button>
      <button
        class="btn"
        style="grid-column: span 3; background: #1d4ed8"
        onclick="handleInput('drop')"
      >
        QUICK DROP
      </button>
    </div>

    <script>
      // --- 通信・ゲーム変数 ---
      let peer,
        conn,
        myID = Math.floor(1e9 + Math.random() * 9e8).toString();
      let myWins = 0,
        enemyWins = 0,
        gameActive = false;
      let isReady = false,
        enemyReady = false;

      const ROWS = 12,
        COLS = 6,
        SIZE = 40;
      const COLORS = [
        null,
        "#ef4444",
        "#22c55e",
        "#3b82f6",
        "#eab308",
        "#a855f7",
      ];

      let board,
        enemyBoard,
        activePuyo,
        score = 0,
        enemyScore = 0;
      let myOjamaStock = 0,
        enemyOjamaStock = 0; // 予告ぷよ数
      let isProcessing = false;

      const myCanvas = document.getElementById("my-canvas"),
        myCtx = myCanvas.getContext("2d");
      const enemyCanvas = document.getElementById("enemy-canvas"),
        enemyCtx = enemyCanvas.getContext("2d");

      // --- PeerJS通信 ---
      function initPeer() {
        peer = new Peer(myID, {
          config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] },
        });
        peer.on(
          "open",
          (id) =>
            (document.getElementById("my-id-display").innerText = "ID: " + id),
        );
        peer.on("connection", (c) => {
          conn = c;
          setupConn();
        });
      }

      document.getElementById("connect-btn").onclick = () => {
        const tid = document.getElementById("target-id").value;
        if (tid.length === 10) {
          conn = peer.connect(tid);
          setupConn();
        }
      };

      function setupConn() {
        conn.on("open", () => {
          document.getElementById("view-connect").style.display = "none";
          document.getElementById("view-ready").style.display = "block";
        });
        conn.on("data", (data) => {
          if (data.type === "READY") {
            enemyReady = true;
            checkStart();
          }
          if (data.type === "STATE") {
            enemyBoard = data.board;
            enemyScore = data.score;
            enemyOjamaStock = data.ojama;
            drawEnemy();
          }
          if (data.type === "ATTACK") {
            myOjamaStock += data.amount;
            updateOjamaUI();
          }
          if (data.type === "LOSE") finishRound("WIN");
        });
      }

      function checkStart() {
        if (isReady && enemyReady) {
          document.getElementById("ui-overlay").style.display = "none";
          startCountdown();
        }
      }

      document.getElementById("ready-btn").onclick = () => {
        isReady = true;
        document.getElementById("ready-btn").disabled = true;
        conn.send({ type: "READY" });
        checkStart();
      };

      async function startCountdown() {
        const cd = document.getElementById("countdown");
        for (let i = 3; i > 0; i--) {
          cd.innerText = i;
          await new Promise((r) => setTimeout(r, 1000));
        }
        cd.innerText = "GO!";
        setTimeout(() => (cd.innerText = ""), 1000);
        startGame();
      }

      // --- ゲームロジック ---
      function startGame() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        enemyBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        myOjamaStock = 0;
        enemyOjamaStock = 0;
        activePuyo = new PuyoPair();
        gameActive = true;
        isProcessing = false;
        gameLoop();
      }

      class PuyoPair {
        constructor() {
          this.x = 2;
          this.y = 0;
          this.rot = 0;
          this.c1 = Math.floor(Math.random() * 4) + 1;
          this.c2 = Math.floor(Math.random() * 4) + 1;
        }
        getPos() {
          const pos = [{ x: this.x, y: this.y, c: this.c1 }];
          const ox = [0, 1, 0, -1][this.rot],
            oy = [-1, 0, 1, 0][this.rot];
          pos.push({ x: this.x + ox, y: this.y + oy, c: this.c2 });
          return pos;
        }
      }

      async function gameLoop() {
        if (!gameActive) return;
        if (!isProcessing) {
          if (canMove(activePuyo, 0, 1)) {
            activePuyo.y++;
          } else {
            isProcessing = true;
            // 設置
            activePuyo.getPos().forEach((p) => {
              if (p.y >= 0) board[p.y][p.x] = p.c;
            });
            activePuyo = null;

            // 連鎖処理
            await handleChain();

            // おじゃま落下
            if (myOjamaStock > 0) await dropOjama();

            // 次のぷよ
            activePuyo = new PuyoPair();
            if (!canMove(activePuyo, 0, 0)) {
              finishRound("LOSE");
              return;
            }
            isProcessing = false;
          }
        }
        draw();
        sync();
        setTimeout(gameLoop, isProcessing ? 100 : 800);
      }

      async function handleChain() {
        let chain = 0;
        while (true) {
          // 自由落下
          let dropped = true;
          while (dropped) {
            dropped = false;
            for (let y = ROWS - 2; y >= 0; y--) {
              for (let x = 0; x < COLS; x++) {
                if (board[y][x] && !board[y + 1][x]) {
                  board[y + 1][x] = board[y][x];
                  board[y][x] = 0;
                  dropped = true;
                }
              }
            }
            if (dropped) {
              draw();
              await new Promise((r) => setTimeout(r, 80));
            }
          }

          const matches = findMatches();
          if (matches.length === 0) break;

          chain++;
          let attackPower = Math.floor(matches.length / 4) * chain;

          // 【相殺ロジック】
          if (myOjamaStock > 0) {
            let offset = Math.min(myOjamaStock, attackPower);
            myOjamaStock -= offset;
            attackPower -= offset;
          }

          // 相殺しきれなかった分を相手に送る
          if (attackPower > 0)
            conn.send({ type: "ATTACK", amount: attackPower });

          matches.forEach((p) => (board[p.y][p.x] = 0));
          score += matches.length * 10 * chain;
          updateOjamaUI();
          draw();
          await new Promise((r) => setTimeout(r, 400));
        }
      }

      function findMatches() {
        let matched = [],
          v = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (board[y][x] && board[y][x] !== 9 && !v[y][x]) {
              let group = [],
                color = board[y][x],
                q = [{ x, y }];
              while (q.length) {
                let c = q.pop();
                if (
                  c.x < 0 ||
                  c.x >= COLS ||
                  c.y < 0 ||
                  c.y >= ROWS ||
                  v[c.y][c.x] ||
                  board[c.y][c.x] !== color
                )
                  continue;
                v[c.y][c.x] = true;
                group.push(c);
                q.push(
                  { x: c.x + 1, y: c.y },
                  { x: c.x - 1, y: c.y },
                  { x: c.x, y: c.y + 1 },
                  { x: c.x, y: c.y - 1 },
                );
              }
              if (group.length >= 4) matched.push(...group);
            }
          }
        }
        return matched;
      }

      async function dropOjama() {
        let count = Math.min(myOjamaStock, 12); // 一度に降る最大数
        myOjamaStock -= count;
        for (let i = 0; i < count; i++) {
          let x = i % COLS;
          for (let y = 0; y < ROWS; y++) {
            if (board[y][x] === 0) {
              board[y][x] = 9; // おじゃまぷよ
              break;
            }
          }
        }
        updateOjamaUI();
        draw();
        await new Promise((r) => setTimeout(r, 200));
      }

      function canMove(p, dx, dy, dr = 0) {
        if (!p) return false;
        const nr = (p.rot + dr + 4) % 4;
        const ox = [0, 1, 0, -1][nr],
          oy = [-1, 0, 1, 0][nr];
        return [
          { x: p.x + dx, y: p.y + dy },
          { x: p.x + dx + ox, y: p.y + dy + oy },
        ].every(
          (pt) =>
            pt.x >= 0 &&
            pt.x < COLS &&
            pt.y < ROWS &&
            (pt.y < 0 || board[pt.y][pt.x] === 0),
        );
      }

      function handleInput(type) {
        if (!gameActive || isProcessing) return;
        if (type === "left" && canMove(activePuyo, -1, 0)) activePuyo.x--;
        if (type === "right" && canMove(activePuyo, 1, 0)) activePuyo.x++;
        if (type === "rot") {
          if (canMove(activePuyo, 0, 0, 1))
            activePuyo.rot = (activePuyo.rot + 1) % 4;
          else if (canMove(activePuyo, -1, 0, 1)) {
            activePuyo.x--;
            activePuyo.rot = (activePuyo.rot + 1) % 4;
          }
        }
        if (type === "drop") {
          while (canMove(activePuyo, 0, 1)) activePuyo.y++;
        }
        draw();
        sync();
      }

      function draw() {
        myCtx.clearRect(0, 0, 240, 480);
        board.forEach((row, y) =>
          row.forEach((c, x) => {
            if (c) drawPuyo(myCtx, x, y, c);
          }),
        );
        if (activePuyo)
          activePuyo.getPos().forEach((p) => drawPuyo(myCtx, p.x, p.y, p.c));
        document.getElementById("my-score").innerText = `YOU: ${score}`;
      }

      function drawEnemy() {
        enemyCtx.clearRect(0, 0, 240, 480);
        enemyBoard.forEach((row, y) =>
          row.forEach((c, x) => {
            if (c) drawPuyo(enemyCtx, x, y, c);
          }),
        );
        document.getElementById("enemy-score").innerText =
          `ENEMY: ${enemyScore}`;
        updateOjamaUI();
      }

      function drawPuyo(ctx, x, y, c) {
        ctx.fillStyle = c === 9 ? "#94a3b8" : COLORS[c];
        ctx.beginPath();
        ctx.arc(x * SIZE + 20, y * SIZE + 20, 18, 0, Math.PI * 2);
        ctx.fill();
        if (c !== 9) {
          // 目玉
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(x * SIZE + 13, y * SIZE + 18, 5, 0, Math.PI * 2);
          ctx.arc(x * SIZE + 27, y * SIZE + 18, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateOjamaUI() {
        const myBar = document.getElementById("my-ojama-bar");
        myBar.innerHTML =
          myOjamaStock > 0
            ? `<span class="ojama-warning">` +
              "⚠".repeat(Math.min(myOjamaStock, 10)) +
              ` (${myOjamaStock})</span>`
            : "";
        const enBar = document.getElementById("enemy-ojama-bar");
        enBar.innerHTML =
          enemyOjamaStock > 0 ? "⚠".repeat(Math.min(enemyOjamaStock, 10)) : "";
      }

      function sync() {
        if (conn && conn.open)
          conn.send({ type: "STATE", board, score, ojama: myOjamaStock });
      }

      function finishRound(res) {
        if (!gameActive) return;
        gameActive = false;
        if (res === "LOSE") conn.send({ type: "LOSE" });
        if (res === "WIN") myWins++;
        else enemyWins++;

        const myL = document.getElementById("my-lamps").children;
        const enL = document.getElementById("enemy-lamps").children;
        for (let i = 0; i < 2; i++) {
          myL[i].className = i < myWins ? "lamp active" : "lamp";
          enL[i].className = i < enemyWins ? "lamp active" : "lamp";
        }

        if (myWins >= 2 || enemyWins >= 2) {
          document.getElementById("ui-overlay").style.display = "flex";
          document.getElementById("view-result").style.display = "block";
          document.getElementById("result-text").innerText =
            myWins >= 2 ? "MATCH WIN!" : "MATCH LOSE...";
        } else {
          setTimeout(() => {
            isReady = false;
            enemyReady = false;
            document.getElementById("ready-btn").disabled = false;
            document.getElementById("ui-overlay").style.display = "flex";
            document.getElementById("view-ready").style.display = "block";
          }, 2000);
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") handleInput("left");
        if (e.key === "ArrowRight") handleInput("right");
        if (e.key === "ArrowUp") handleInput("rot");
        if (e.key === "ArrowDown") handleInput("drop");
      });

      initPeer();
    </script>
  </body>
</html>
