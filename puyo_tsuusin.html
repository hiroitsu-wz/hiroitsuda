<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MARUICHI Online - Personal Difficulty</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      html, body {
        width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        background-color: #0f172a; touch-action: none; color: white;
        font-family: "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center;
      }
      .moon {
        position: absolute; width: 400px; height: 200px; filter: blur(60px);
        z-index: -1; opacity: 0.2; border-radius: 50%; top: -50px; right: -100px;
        background: linear-gradient(to bottom, #38bdf8, #818cf8);
      }
      #ui-overlay {
        position: absolute; inset: 0; z-index: 1000; background: rgba(15, 23, 42, 0.95);
        display: flex; justify-content: center; align-items: center;
      }
      .modal {
        background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #334155;
        width: 85%; max-width: 320px; text-align: center; display: none;
      }
      #view-connect { display: block; }
      input {
        padding: 12px; font-size: 16px; margin: 8px 0; width: 90%;
        background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; outline: none;
      }
      .big-btn {
        margin-top: 10px; width: 100%; background: #3b82f6; color: white;
        border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer;
      }
      .sub-btn {
        margin-top: 10px; width: 100%; background: #475569; color: white;
        border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
      }
      .difficulty-selector { display: flex; gap: 5px; margin: 15px 0; justify-content: center; }
      .diff-btn {
        flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155;
        background: #0f172a; color: #94a3b8; cursor: pointer; font-size: 13px;
      }
      .diff-btn.active { background: #3b82f6; color: white; border-color: #60a5fa; }
      .battle-container { display: flex; gap: 5px; margin-top: 5px; transform-origin: top center; }
      .field-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
      canvas { background: rgba(30, 41, 59, 0.95); border: 2px solid #475569; border-radius: 8px; width: 150px; height: 300px; }
      .my-field canvas { border-color: #3b82f6; }
      .next-area { margin-left: 5px; display: flex; flex-direction: column; gap: 8px; }
      .next-box {
        width: 35px; height: 70px; background: rgba(0, 0, 0, 0.3); border-radius: 8px;
        display: flex; flex-direction: column; align-items: center; padding: 5px 0; border: 1px solid #334155;
      }
      .controller { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 95%; max-width: 360px; margin-top: 10px; }
      .ctrl-btn { background: #334155; border: none; border-radius: 12px; color: white; font-size: 24px; padding: 12px 0; touch-action: none; user-select: none; }
      .btn-rot-l { background: #ec4899; } .btn-rot-r { background: #8b5cf6; }
      .btn-drop { background: #3b82f6; grid-column: span 4; padding: 10px 0; font-size: 16px; font-weight: bold; }
      .ojama-bar { height: 18px; font-size: 10px; color: #ef4444; font-weight: bold; width: 150px; text-align: center; }
      .score-box { font-size: 12px; color: #38bdf8; font-family: monospace; margin-bottom: 2px; }
      .name-label { font-size: 14px; font-weight: bold; color: white; margin-bottom: 2px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .match-score { font-size: 24px; color: #facc15; margin: 5px 0; font-weight: 900; }
      #countdown-text { position: absolute; font-size: 80px; font-weight: 900; color: #facc15; z-index: 2000; display: none; pointer-events: none; top: 40%; }
    </style>
  </head>
  <body>
    <div class="moon"></div>
    <div id="countdown-text">3</div>
    <div id="ui-overlay">
      <div id="view-connect" class="modal">
        <h2>MARUICHI Online</h2>
        <input type="text" id="my-name-input" placeholder="あなたの名前" maxlength="10" />
        <p id="my-id-display" style="color: #38bdf8; font-size: 12px">ID発行中...</p>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 10px">自分の難易度設定</div>
        <div class="difficulty-selector">
          <button class="diff-btn active" onclick="setDifficulty(4, this)">4色</button>
          <button class="diff-btn" onclick="setDifficulty(5, this)">5色</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0" />
        <input type="tel" id="target-id" placeholder="相手のIDを入力" />
        <button class="big-btn" id="connect-btn">対戦を申し込む</button>
      </div>
      <div id="view-ready" class="modal">
        <h2>READY?</h2>
        <p id="ready-status" style="color: #94a3b8; font-size: 14px; margin-bottom: 10px">準備ができたらボタンを押してね</p>
        <button class="big-btn" id="ready-btn">準備完了</button>
        <button class="sub-btn" onclick="location.reload()">トップに戻る</button>
      </div>
      <div id="view-result" class="modal">
        <h2 id="result-text">WIN</h2>
        <div id="match-status" class="match-score">★ 0 - 0 ★</div>
        <button class="big-btn" id="next-match-btn">次の試合へ</button>
        <button class="sub-btn" onclick="location.reload()">終了</button>
      </div>
      <div id="view-disconnect" class="modal">
        <h2>DISCONNECTED</h2>
        <button class="big-btn" onclick="location.reload()">トップに戻る</button>
      </div>
    </div>

    <div style="margin-top: 5px; font-size: 16px; font-weight: bold; color: #38bdf8;">MARUICHI Online</div>
    <div style="display: flex; gap: 40px; margin-bottom: 2px">
      <div id="my-stars" style="color: #facc15; font-size: 18px">☆☆</div>
      <div id="enemy-stars" style="color: #facc15; font-size: 18px">☆☆</div>
    </div>
    <div class="battle-container">
      <div class="field-wrapper my-field">
        <div id="my-name-display" class="name-label">YOU</div>
        <div id="my-score" class="score-box">SCORE: 0</div>
        <div id="my-ojama-bar" class="ojama-bar"></div>
        <div style="display: flex; align-items: flex-start">
          <canvas id="my-canvas"></canvas>
          <div class="next-area">
            <div class="next-box" id="next1"></div>
            <div class="next-box" id="next2" style="transform: scale(0.8)"></div>
          </div>
        </div>
      </div>
      <div class="field-wrapper">
        <div id="enemy-name-display" class="name-label">ENEMY</div>
        <div id="enemy-score" class="score-box">SCORE: 0</div>
        <div id="enemy-ojama-bar" class="ojama-bar"></div>
        <canvas id="enemy-canvas"></canvas>
      </div>
    </div>
    <div class="controller">
      <button class="ctrl-btn" id="m-left">←</button>
      <button class="ctrl-btn btn-rot-l" id="m-rot-l">↺</button>
      <button class="ctrl-btn btn-rot-r" id="m-rot-r">↻</button>
      <button class="ctrl-btn" id="m-right">→</button>
      <button class="ctrl-btn btn-drop" id="m-down">QUICK DROP</button>
    </div>

    <script>
      const se = { pop: new Audio("puyo_pop.mp3"), move: new Audio("puyo_move.mp3"), rot: new Audio("puyo_rotate.mp3"), btn: new Audio("puyo_button.mp3"), set: new Audio("puyo_set.mp3"), ojama: new Audio("puyo_ojama.mp3"), count: new Audio("puyo_count.mp3") };
      function play(k) { if (se[k]) { se[k].currentTime = 0; se[k].play().catch(() => {}); } }

      let peer, conn, myID = Math.floor(1e8 + Math.random() * 9e7).toString();
      let myName = "YOU", enemyName = "ENEMY";
      let board, enemyBoard, activePuyo, enemyActivePuyo, myOjama = 0, enemyOjama = 0;
      let myScore = 0, enemyScore = 0, myWins = 0, enemyWins = 0;
      let nextQueue = [], gameActive = false, isProcessing = false, amIReady = false, isEnemyReady = false;
      let particles = [], gameColorCount = 4;

      const WIN_GOAL = 2, ROWS = 12, COLS = 6, SIZE = 25;
      const COLORS = [null, "#ef4444", "#22c55e", "#3b82f6", "#eab308", "#a855f7"];
      const myCanvas = document.getElementById("my-canvas"), enemyCanvas = document.getElementById("enemy-canvas");
      const myCtx = myCanvas.getContext("2d"), enemyCtx = enemyCanvas.getContext("2d");

      function setupCanvas(canvas) {
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = "150px"; canvas.style.height = "300px";
        canvas.width = 150 * dpr; canvas.height = 300 * dpr;
        canvas.getContext("2d").scale(dpr, dpr);
      }
      setupCanvas(myCanvas); setupCanvas(enemyCanvas);

      function setDifficulty(num, btn) {
        play("btn"); gameColorCount = num;
        document.querySelectorAll(".diff-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      }

      class Particle {
        constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.vx = (Math.random() - 0.5) * 8; this.vy = (Math.random() - 0.5) * 8; this.life = 1.0; }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
        draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
      }

      peer = new Peer(myID);
      peer.on("open", (id) => (document.getElementById("my-id-display").innerText = "YOUR ID: " + id));
      peer.on("connection", (c) => { conn = c; setupConn(); });

      document.getElementById("connect-btn").onclick = () => {
        play("btn"); const tid = document.getElementById("target-id").value;
        myName = document.getElementById("my-name-input").value || "YOU";
        if (tid) { conn = peer.connect(tid); setupConn(); }
      };

      function setupConn() {
        conn.on("open", () => {
          conn.send({ type: "INFO", name: myName });
          document.getElementById("my-name-display").innerText = myName;
          showModal("view-ready");
        });
        conn.on("data", (data) => {
          if (data.type === "INFO") { enemyName = data.name; document.getElementById("enemy-name-display").innerText = enemyName; }
          if (data.type === "READY") { isEnemyReady = true; updateReadyUI(); checkStart(); }
          if (data.type === "SYNC") { enemyBoard = data.board; enemyActivePuyo = data.active; enemyOjama = data.ojama; enemyScore = data.score; updateScoreUI(); updateOjamaUI(); }
          if (data.type === "ATTACK") { myOjama += data.amount; updateOjamaUI(); }
          if (data.type === "GAMEOVER") { if (gameActive) endGame("WIN"); }
        });
      }

      function showModal(id) { document.querySelectorAll(".modal").forEach((m) => (m.style.display = "none")); document.getElementById(id).style.display = "block"; document.getElementById("ui-overlay").style.display = "flex"; }
      function updateReadyUI() { const msg = isEnemyReady ? "相手は準備完了！" : amIReady ? "相手の準備待ち..." : "準備ができたらボタンを！"; document.getElementById("ready-status").innerText = msg; }
      function checkStart() { if (amIReady && isEnemyReady) { amIReady = false; isEnemyReady = false; startCountdown(); } }
      const readyAction = () => { play("btn"); amIReady = true; if (myWins === WIN_GOAL || enemyWins === WIN_GOAL) { myWins = 0; enemyWins = 0; document.getElementById("my-stars").innerText = "☆☆"; document.getElementById("enemy-stars").innerText = "☆☆"; } conn.send({ type: "READY" }); updateReadyUI(); checkStart(); };
      document.getElementById("ready-btn").onclick = readyAction; document.getElementById("next-match-btn").onclick = readyAction;

      async function startCountdown() {
        document.getElementById("ui-overlay").style.display = "none";
        const ct = document.getElementById("countdown-text"); ct.style.display = "block";
        for (let i = 3; i > 0; i--) { ct.innerText = i; play("count"); await new Promise((r) => setTimeout(r, 1000)); }
        ct.innerText = "GO!"; await new Promise((r) => setTimeout(r, 500));
        ct.style.display = "none"; startGame();
      }

      function startGame() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0)); enemyBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        myOjama = 0; enemyOjama = 0; myScore = 0; enemyScore = 0; particles = [];
        nextQueue = Array.from({ length: 3 }, () => ({ c1: rnd(), c2: rnd() }));
        spawnPuyo(); gameActive = true; updateScoreUI(); requestAnimationFrame(renderLoop);
      }

      function rnd() { return Math.floor(Math.random() * gameColorCount) + 1; }
      function spawnPuyo() { if (board[0][2] !== 0) { endGame("LOSE"); conn.send({ type: "GAMEOVER" }); return; } activePuyo = { x: 2, y: 0, rot: 0, ...nextQueue.shift() }; nextQueue.push({ c1: rnd(), c2: rnd() }); updateNextUI(); sync(); }
      setInterval(() => { if (gameActive && !isProcessing) { if (canMove(0, 1, 0, activePuyo)) { activePuyo.y++; sync(); } else { lockPuyo(); } } }, 800);
      function canMove(dx, dy, dr, p) { const nr = (p.rot + dr + 4) % 4, ox = [0, 1, 0, -1][nr], oy = [-1, 0, 1, 0][nr]; const pts = [{ x: p.x + dx, y: p.y + dy }, { x: p.x + dx + ox, y: p.y + dy + oy }]; return pts.every((pt) => pt.x >= 0 && pt.x < COLS && pt.y < ROWS && (pt.y < 0 || board[pt.y][pt.x] === 0)); }

      function handleInput(type) {
        if (!gameActive || isProcessing) return;
        if (type === "left" && canMove(-1, 0, 0, activePuyo)) { activePuyo.x--; play("move"); }
        else if (type === "right" && canMove(1, 0, 0, activePuyo)) { activePuyo.x++; play("move"); }
        else if (type === "down" && canMove(0, 1, 0, activePuyo)) { activePuyo.y++; play("move"); }
        else if (type === "rotR") rotate(1); else if (type === "rotL") rotate(-1);
        else if (type === "drop") { while (canMove(0, 1, 0, activePuyo)) activePuyo.y++; lockPuyo(); }
        sync();
      }

      function rotate(dr) {
        const nr = (activePuyo.rot + dr + 4) % 4;
        if (canMove(0, 0, dr, activePuyo)) { activePuyo.rot = nr; play("rot"); }
        else if (canMove(1, 0, dr, activePuyo)) { activePuyo.x++; activePuyo.rot = nr; play("rot"); }
        else if (canMove(-1, 0, dr, activePuyo)) { activePuyo.x--; activePuyo.rot = nr; play("rot"); }
      }

      async function lockPuyo() {
        isProcessing = true; play("set");
        const ox = [0, 1, 0, -1][activePuyo.rot], oy = [-1, 0, 1, 0][activePuyo.rot];
        if (activePuyo.y >= 0) board[activePuyo.y][activePuyo.x] = activePuyo.c1;
        if (activePuyo.y + oy >= 0) board[activePuyo.y + oy][activePuyo.x + ox] = activePuyo.c2;
        activePuyo = null; await handleChain();
        if (myOjama > 0) await dropOjama();
        if (gameActive) spawnPuyo();
        isProcessing = false;
      }

      async function handleChain() {
        let chain = 1;
        while (true) {
          let dropped = true;
          while (dropped) {
            dropped = false;
            for (let y = ROWS - 2; y >= 0; y--) { for (let x = 0; x < COLS; x++) { if (board[y][x] && !board[y + 1][x]) { board[y + 1][x] = board[y][x]; board[y][x] = 0; dropped = true; } } }
            if (dropped) { sync(); await new Promise((r) => setTimeout(r, 60)); }
          }
          let matches = findMatches(); if (matches.length === 0) break;
          play("pop"); let puyoCount = matches.length;
          let attackPower = Math.floor(puyoCount / 2) + (chain > 1 ? chain * 3 : 0);
          myScore += puyoCount * 10 * chain; updateScoreUI();
          matches.forEach((p) => { for (let i = 0; i < 6; i++) particles.push(new Particle(p.x * SIZE + SIZE / 2, p.y * SIZE + SIZE / 2, COLORS[board[p.y][p.x]])); });
          if (myOjama > 0) { let offset = Math.min(myOjama, attackPower); myOjama -= offset; attackPower -= offset; updateOjamaUI(); }
          const toRemove = new Set(matches.map((p) => `${p.x},${p.y}`));
          matches.forEach((p) => { [{ x: 0, y: 1 }, { x: 0, y: -1 }, { x: 1, y: 0 }, { x: -1, y: 0 }].forEach((ad) => { const nx = p.x + ad.x, ny = p.y + ad.y; if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && board[ny][nx] === 9) toRemove.add(`${nx},${ny}`); }); });
          toRemove.forEach((key) => { const [kx, ky] = key.split(",").map(Number); board[ky][kx] = 0; });
          if (attackPower > 0) conn.send({ type: "ATTACK", amount: attackPower });
          chain++; sync(); await new Promise((r) => setTimeout(r, 450));
        }
      }

      function findMatches() {
        let matched = [], visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (board[y][x] && board[y][x] !== 9 && !visited[y][x]) {
              let group = [], color = board[y][x], stack = [{ x, y }];
              while (stack.length) {
                let c = stack.pop(); if (c.x < 0 || c.x >= COLS || c.y < 0 || c.y >= ROWS || visited[c.y][c.x] || board[c.y][c.x] !== color) continue;
                visited[c.y][c.x] = true; group.push(c);
                stack.push({ x: c.x + 1, y: c.y }, { x: c.x - 1, y: c.y }, { x: c.x, y: c.y + 1 }, { x: c.x, y: c.y - 1 });
              }
              if (group.length >= 4) matched.push(...group);
            }
          }
        }
        return matched;
      }

      function drawPuyo(ctx, x, y, v) { if (y < 0) return; const cx = x * SIZE + SIZE / 2, cy = y * SIZE + SIZE / 2, r = SIZE * 0.45; ctx.fillStyle = v === 9 ? "#cbd5e1" : COLORS[v]; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "white"; ctx.beginPath(); if (v === 9) { ctx.arc(cx - r / 4, cy, r / 6, 0, Math.PI * 2); ctx.arc(cx + r / 4, cy, r / 6, 0, Math.PI * 2); } else { ctx.arc(cx - r / 3, cy, r / 4, 0, Math.PI * 2); ctx.arc(cx + r / 3, cy, r / 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(cx - r / 3, cy, r / 8, 0, Math.PI * 2); ctx.arc(cx + r / 3, cy, r / 8, 0, Math.PI * 2); } ctx.fill(); }
      function drawX(ctx, x, y) { ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; const m = 6; ctx.beginPath(); ctx.moveTo(x * SIZE + m, y * SIZE + m); ctx.lineTo((x + 1) * SIZE - m, (y + 1) * SIZE - m); ctx.moveTo((x + 1) * SIZE - m, y * SIZE + m); ctx.lineTo(x * SIZE + m, (y + 1) * SIZE - m); ctx.stroke(); }

      function renderLoop() {
        if (!gameActive) return;
        myCtx.clearRect(0, 0, myCanvas.width, myCanvas.height); enemyCtx.clearRect(0, 0, enemyCanvas.width, enemyCanvas.height);
        drawX(myCtx, 2, 0); drawX(enemyCtx, 2, 0);
        board.forEach((r, y) => r.forEach((v, x) => { if (v) drawPuyo(myCtx, x, y, v); }));
        enemyBoard.forEach((r, y) => r.forEach((v, x) => { if (v) drawPuyo(enemyCtx, x, y, v); }));
        if (activePuyo && !isProcessing) { const a = activePuyo, ox = [0, 1, 0, -1][a.rot], oy = [-1, 0, 1, 0][a.rot]; drawPuyo(myCtx, a.x, a.y, a.c1); drawPuyo(myCtx, a.x + ox, a.y + oy, a.c2); }
        if (enemyActivePuyo) { const a = enemyActivePuyo, ox = [0, 1, 0, -1][a.rot], oy = [-1, 0, 1, 0][a.rot]; drawPuyo(enemyCtx, a.x, a.y, a.c1); drawPuyo(enemyCtx, a.x + ox, a.y + oy, a.c2); }
        particles = particles.filter((p) => p.life > 0); particles.forEach((p) => { p.update(); p.draw(myCtx); });
        requestAnimationFrame(renderLoop);
      }

      async function dropOjama() { play("ojama"); let count = Math.min(myOjama, 30); myOjama -= count; updateOjamaUI(); while (count > 0) { const lineCount = Math.min(count, 6); const cols = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5); for (let i = 0; i < lineCount; i++) { const x = cols[i]; for (let ty = ROWS - 1; ty >= 0; ty--) { if (board[ty][x] === 0) { board[ty][x] = 9; break; } } } count -= lineCount; sync(); await new Promise((r) => setTimeout(r, 150)); } }
      function sync() { if (conn?.open) conn.send({ type: "SYNC", board, active: activePuyo, ojama: myOjama, score: myScore }); }
      function updateScoreUI() { document.getElementById("my-score").innerText = `SCORE: ${myScore}`; document.getElementById("enemy-score").innerText = `SCORE: ${enemyScore}`; }
      function updateOjamaUI() { document.getElementById("my-ojama-bar").innerText = "●".repeat(Math.min(myOjama, 12)) + (myOjama > 12 ? "+" : ""); document.getElementById("enemy-ojama-bar").innerText = "●".repeat(Math.min(enemyOjama, 12)) + (enemyOjama > 12 ? "+" : ""); }
      function updateNextUI() { [1, 2].forEach((i) => { const p = nextQueue[i - 1], eye = `<div style="width:4px;height:4px;background:white;border-radius:50%;margin:0 1px;"></div>`; document.getElementById(`next${i}`).innerHTML = `<div style="width:16px;height:16px;border-radius:50%;background:${COLORS[p.c2]};margin-bottom:4px;display:flex;justify-content:center;align-items:center;">${eye}${eye}</div><div style="width:16px;height:16px;border-radius:50%;background:${COLORS[p.c1]};display:flex;justify-content:center;align-items:center;">${eye}${eye}</div>`; }); }

      function endGame(res) {
        gameActive = false; if (res === "WIN") myWins++; else enemyWins++;
        document.getElementById("my-stars").innerText = "★".repeat(myWins) + "☆".repeat(WIN_GOAL - myWins);
        document.getElementById("enemy-stars").innerText = "★".repeat(enemyWins) + "☆".repeat(WIN_GOAL - enemyWins);
        const resultTitle = document.getElementById("result-text");
        if (myWins === WIN_GOAL || enemyWins === WIN_GOAL) { resultTitle.innerText = myWins === WIN_GOAL ? "MATCH WINNER!" : "MATCH LOST..."; resultTitle.style.color = myWins === WIN_GOAL ? "#facc15" : "#ef4444"; }
        else { resultTitle.innerText = res === "WIN" ? "YOU WIN!" : "YOU LOSE..."; resultTitle.style.color = "white"; }
        document.getElementById("match-status").innerText = `★ ${myWins} - ${enemyWins} ★`; showModal("view-result");
      }

      window.addEventListener("keydown", (e) => {
        if (!gameActive || isProcessing) return;
        switch (e.code) {
          case "ArrowLeft": handleInput("left"); break; case "ArrowRight": handleInput("right"); break;
          case "ArrowDown": handleInput("down"); break; case "ArrowUp": handleInput("rotR"); break;
          case "ShiftLeft": case "ShiftRight": handleInput("rotL"); break;
          case "Space": e.preventDefault(); handleInput("drop"); break;
        }
      });
      const setupBtn = (id, type) => { const btn = document.getElementById(id); btn.addEventListener("pointerdown", (e) => { e.preventDefault(); handleInput(type); }); };
      setupBtn("m-left", "left"); setupBtn("m-right", "right"); setupBtn("m-rot-l", "rotL"); setupBtn("m-rot-r", "rotR"); setupBtn("m-down", "drop");
    </script>
  </body>
</html>
