<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MANMARU - Sound Master Ultimate</title>
    <style>
      /* スタイルは1の洗練されたダークテーマを維持 */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0f172a;
        touch-action: none;
      }
      body {
        color: white;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .moon {
        position: absolute;
        width: 400px;
        height: 200px;
        filter: blur(60px);
        z-index: -1;
        opacity: 0.2;
        border-radius: 50%;
        top: -50px;
        right: -100px;
        background: linear-gradient(to bottom, #38bdf8, #818cf8);
      }
      .header-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        margin-top: 10px;
        z-index: 10;
      }
      .info {
        font-size: 20px;
        font-weight: 800;
        color: #38bdf8;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.95);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal {
        background: #1e293b;
        padding: 25px;
        border-radius: 20px;
        border: 2px solid #334155;
        width: 85%;
        max-width: 300px;
        text-align: center;
      }
      input {
        padding: 12px;
        font-size: 16px;
        margin: 8px 0;
        width: 90%;
        background: #0f172a;
        color: white;
        border: 1px solid #334155;
        border-radius: 8px;
        outline: none;
      }
      .big-btn {
        margin-top: 10px;
        width: 100%;
        background: #3b82f6;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
      }
      .sub-btn {
        background: #475569;
        font-size: 14px;
        margin-top: 5px;
      }
      .game-container {
        position: relative;
        display: flex;
        gap: 10px;
        margin-top: 5px;
      }
      canvas {
        background: rgba(30, 41, 59, 0.95);
        border: 3px solid #475569;
        border-radius: 12px;
        max-height: 50vh;
        width: auto;
      }
      #next-canvas {
        background: rgba(30, 41, 59, 0.5);
        border: 2px solid #475569;
        border-radius: 8px;
        align-self: flex-start;
      }
      #chain-msg {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        color: #facc15;
        font-size: 32px;
        font-weight: 900;
        pointer-events: none;
        text-shadow: 2px 2px 0 #000;
        z-index: 50;
        text-align: center;
        white-space: pre-wrap;
      }
      .controller {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        width: 95%;
        max-width: 360px;
        margin-top: 10px;
      }
      .ctrl-btn {
        background: #334155;
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 24px;
        padding: 15px 0;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-rot-l {
        background: #ec4899;
      }
      .btn-rot-r {
        background: #8b5cf6;
      }
      .btn-drop {
        background: #3b82f6;
        grid-column: span 4;
        padding: 10px 0;
        font-size: 16px;
        font-weight: bold;
      }
      .sys-btn {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 5px;
        border: none;
        color: white;
        background: #475569;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      table {
        width: 100%;
        margin-top: 10px;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 6px;
        border-bottom: 1px solid #334155;
      }
      .highlight {
        color: #facc15;
        font-weight: bold;
        background: rgba(250, 204, 21, 0.1);
      }
    </style>
  </head>
  <body>
    <a
      href="index_potal.html"
      style="
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 2000;
        color: #94a3b8;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 16px;
        border: 1px solid #334155;
        border-radius: 20px;
        background: rgba(30, 41, 59, 0.7);
        font-family: sans-serif;
      "
      >◀ PORTAL</a
    >
    <div class="moon"></div>
    <div id="overlay">
      <div id="login-modal" class="modal hidden">
        <h2>Set Name</h2>
        <input
          type="text"
          id="nickname"
          placeholder="ニックネーム"
          maxlength="10"
        />
        <button id="loginBtn" class="big-btn">OK</button>
      </div>
      <div id="start-modal" class="modal hidden">
        <h2 style="margin: 0">READY?</h2>
        <p id="player-display" style="color: #38bdf8; margin: 5px 0 15px 0"></p>
        <div
          style="
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
          "
        >
          <button
            id="btn4color"
            class="sys-btn"
            style="flex: 1; padding: 12px; font-weight: bold"
          >
            4 COLORS
          </button>
          <button
            id="btn5color"
            class="sys-btn"
            style="flex: 1; padding: 12px; font-weight: bold"
          >
            5 COLORS
          </button>
        </div>
        <button id="playBtn" class="big-btn">GAME START</button>
        <button id="startRankBtn" class="big-btn sub-btn">RANKING</button>
        <button
          id="changeNameBtn"
          class="big-btn sub-btn"
          style="background: transparent; color: #94a3b8"
        >
          Change Name
        </button>
      </div>
      <div id="rank-modal" class="modal hidden">
        <h2 id="rank-title">Ranking</h2>
        <div id="rank-list" style="max-height: 200px; overflow-y: auto"></div>
        <button id="backBtn" class="big-btn sub-btn">CLOSE</button>
      </div>
    </div>

    <div class="header-area">
      <h1>PUYOichi</h1>
      <div class="info">SCORE: <span id="score">0</span></div>
    </div>

    <div id="chain-msg"></div>
    <div class="game-container">
      <canvas id="game" width="240" height="480"></canvas>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 10px; margin-bottom: 2px; font-weight: bold"
          >NEXT</span
        >
        <canvas id="next-canvas" width="60" height="150"></canvas>
      </div>
    </div>

    <div class="controller">
      <button class="ctrl-btn" id="m-left">←</button>
      <button class="ctrl-btn btn-rot-l" id="m-rot-l">↺</button>
      <button class="ctrl-btn btn-rot-r" id="m-rot-r">↻</button>
      <button class="ctrl-btn" id="m-right">→</button>
      <button class="ctrl-btn btn-drop" id="m-down">QUICK DROP</button>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 8px">
      <button class="sys-btn" id="pauseBtn">Pause</button>
      <button class="sys-btn" id="resetBtn" style="background: #ef4444">
        Reset
      </button>
    </div>

    <script>
      // --- 音源設定 (1のピッチ変更対応) ---
      const se = {
        set: new Audio("puyo_set.mp3"),
        pop: new Audio("puyo_pop.mp3"),
        rot: new Audio("puyo_rotate.mp3"),
        btn: new Audio("puyo_button.mp3"),
        rank: new Audio("ranking_botton.mp3"),
        move: new Audio("puyo_move.mp3"),
      };
      Object.values(se).forEach((s) => (s.volume = 0.3));

      function playSE(audio, pitch = 1.0) {
        audio.currentTime = 0;
        audio.playbackRate = pitch;
        audio.play().catch(() => {});
      }

      // --- ゲーム定数と変数 ---
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const nextCtx = document.getElementById("next-canvas").getContext("2d");
      const scoreElement = document.getElementById("score");
      const chainMsg = document.getElementById("chain-msg");
      const overlay = document.getElementById("overlay");

      const ROWS = 12,
        COLS = 6,
        SIZE = 40;
      const COLORS = [
        null,
        "#ef4444",
        "#22c55e",
        "#3b82f6",
        "#eab308",
        "#a855f7",
      ];

      let board,
        score,
        activePuyo,
        nextPuyos,
        isProcessing,
        isPaused,
        gameRunning,
        waitingForStart;
      let playerName, playerID, fallCounter, lockTimer, colorCount;
      const LOCK_DELAY = 35,
        BASE_FALL_SPEED = 40;
      let particles = [];
      let moveRepeatTimer = null;

      // --- クラス定義 (2のパーティクル移植) ---
      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.speedX = (Math.random() - 0.5) * 10;
          this.speedY = (Math.random() - 0.5) * 10;
          this.life = 1.0;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.speedY += 0.2;
          this.life -= 0.04;
        }
        draw(c) {
          c.save();
          c.globalAlpha = this.life;
          c.fillStyle = this.color;
          c.beginPath();
          c.arc(this.x, this.y, 3, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }
      }

      class PuyoPair {
        constructor() {
          this.x = 2;
          this.y = 0;
          this.rot = 0;
          this.c1 = Math.floor(Math.random() * colorCount) + 1;
          this.c2 = Math.floor(Math.random() * colorCount) + 1;
        }
        getPos() {
          const pos = [{ x: this.x, y: this.y, c: this.c1 }];
          const ox = [0, 1, 0, -1][this.rot],
            oy = [-1, 0, 1, 0][this.rot];
          pos.push({ x: this.x + ox, y: this.y + oy, c: this.c2 });
          return pos;
        }
      }

      // --- 初期化・描画ロジック (2の構造を1に適用) ---
      function initGameVars() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        scoreElement.innerText = "0";
        activePuyo = null;
        colorCount = parseInt(localStorage.getItem("puyoColorCount")) || 5;
        nextPuyos = [new PuyoPair(), new PuyoPair()];
        isProcessing = false;
        isPaused = false;
        gameRunning = false;
        waitingForStart = true;
        fallCounter = 0;
        lockTimer = 0;
        particles = [];
      }

      function drawUnit(targetCtx, x, y, colorIndex, size) {
        const px = x * size + size / 2,
          py = y * size + size / 2,
          r = size * 0.45;
        targetCtx.fillStyle = COLORS[colorIndex];
        targetCtx.beginPath();
        targetCtx.arc(px, py, r, 0, Math.PI * 2);
        targetCtx.fill();
        // 目玉 (1のスタイル)
        targetCtx.fillStyle = "white";
        targetCtx.beginPath();
        targetCtx.arc(px - r / 3, py, r / 4, 0, Math.PI * 2);
        targetCtx.arc(px + r / 3, py, r / 4, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.fillStyle = "black";
        targetCtx.beginPath();
        targetCtx.arc(px - r / 3, py, r / 8, 0, Math.PI * 2);
        targetCtx.arc(px + r / 3, py, r / 8, 0, Math.PI * 2);
        targetCtx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        board.forEach((row, y) =>
          row.forEach((val, x) => {
            if (val) drawUnit(ctx, x, y, val, SIZE);
          }),
        );
        if (board[0][2] === 0) drawXMark(2, 0);
        if (activePuyo)
          activePuyo
            .getPos()
            .forEach((p) => drawUnit(ctx, p.x, p.y, p.c, SIZE));
        particles.forEach((p, i) => {
          p.update();
          p.draw(ctx);
          if (p.life <= 0) particles.splice(i, 1);
        });
        if (isPaused) {
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "white";
          ctx.font = "bold 24px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("PAUSED", canvas.width / 2, 240);
        }
        drawNext();
      }

      function drawNext() {
        nextCtx.clearRect(0, 0, 60, 150);
        drawUnit(nextCtx, 0.25, 0.5, nextPuyos[0].c2, 25);
        drawUnit(nextCtx, 0.25, 1.5, nextPuyos[0].c1, 25);
        drawUnit(nextCtx, 0.4, 3.5, nextPuyos[1].c2, 18);
        drawUnit(nextCtx, 0.4, 4.3, nextPuyos[1].c1, 18);
      }

      function drawXMark(x, y) {
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        ctx.beginPath();
        const m = 12;
        ctx.moveTo(x * SIZE + m, y * SIZE + m);
        ctx.lineTo(x * SIZE + SIZE - m, y * SIZE + SIZE - m);
        ctx.moveTo(x * SIZE + SIZE - m, y * SIZE + m);
        ctx.lineTo(x * SIZE + m, y * SIZE + SIZE - m);
        ctx.stroke();
      }

      // --- ゲームコアロジック ---
      async function gameLoop() {
        if (!gameRunning || waitingForStart || isPaused) return;
        if (!isProcessing) {
          if (!activePuyo) {
            activePuyo = nextPuyos.shift();
            nextPuyos.push(new PuyoPair());
            if (checkCollision(activePuyo)) {
              gameRunning = false;
              saveScore(score);
              alert(`GAME OVER!\nScore: ${score}`);
              showStartScreen();
              return;
            }
          }
          let speed = Math.max(
            5,
            BASE_FALL_SPEED - Math.floor(score / 1500) * 5,
          );
          if (canMove(activePuyo, 0, 1)) {
            lockTimer = 0;
            if (++fallCounter >= speed) {
              activePuyo.y++;
              fallCounter = 0;
            }
          } else {
            if (++lockTimer >= LOCK_DELAY) {
              lockPuyo();
              playSE(se.set);
              activePuyo = null;
              isProcessing = true;
              await handleChain();
              isProcessing = false;
            }
          }
        }
        draw();
        requestAnimationFrame(gameLoop);
      }

      async function handleChain() {
        let chain = 0;
        while (true) {
          await applyGravityAnimated();
          const result = findMatches();
          if (result.matches.length === 0) break;
          chain++;
          score += result.matches.length * 10 * chain;
          scoreElement.innerText = score;
          showChainMsg(chain > 1 ? `${chain} CHAIN!` : "HIT!");
          playSE(se.pop, 1.0 + chain * 0.1); // 1のピッチアップ移植
          result.matches.forEach((p) => {
            const color = COLORS[board[p.y][p.x]] || "#fff";
            for (let i = 0; i < 8; i++)
              particles.push(
                new Particle(p.x * SIZE + 20, p.y * SIZE + 20, color),
              );
            board[p.y][p.x] = 0;
          });
          draw();
          await new Promise((r) => setTimeout(r, 400));
        }
        if (board.every((row) => row.every((c) => c === 0))) {
          score += 2100;
          scoreElement.innerText = score;
          showChainMsg("ALL CLEAR!\n+2100");
        }
      }

      async function applyGravityAnimated() {
        let moved = true;
        while (moved) {
          moved = false;
          for (let x = 0; x < COLS; x++) {
            for (let y = ROWS - 2; y >= 0; y--) {
              if (board[y][x] !== 0 && board[y + 1][x] === 0) {
                board[y + 1][x] = board[y][x];
                board[y][x] = 0;
                moved = true;
              }
            }
          }
          if (moved) {
            draw();
            await new Promise((r) => setTimeout(r, 60));
          }
        }
      }

      function checkCollision(p) {
        return p
          .getPos()
          .some(
            (pos) =>
              pos.x < 0 ||
              pos.x >= COLS ||
              pos.y >= ROWS ||
              (pos.y >= 0 && board[pos.y][pos.x] !== 0),
          );
      }
      function canMove(p, dx, dy) {
        const t = { x: p.x + dx, y: p.y + dy, rot: p.rot, getPos: p.getPos };
        return !checkCollision(t);
      }
      function rotate(dir) {
        if (!activePuyo || isProcessing || isPaused) return;
        const oldR = activePuyo.rot,
          oldX = activePuyo.x;
        activePuyo.rot = (activePuyo.rot + dir + 4) % 4;
        if (checkCollision(activePuyo)) {
          activePuyo.x += activePuyo.x < 3 ? 1 : -1;
          if (checkCollision(activePuyo)) {
            activePuyo.rot = oldR;
            activePuyo.x = oldX;
            return;
          }
        }
        playSE(se.rot);
        draw();
      }
      function lockPuyo() {
        activePuyo.getPos().forEach((p) => {
          if (p.y >= 0) board[p.y][p.x] = p.c;
        });
      }

      function findMatches() {
        let matched = [],
          v = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (board[y][x] && !v[y][x]) {
              let group = [],
                color = board[y][x],
                q = [{ x, y }];
              while (q.length) {
                let c = q.pop();
                if (
                  c.x < 0 ||
                  c.x >= COLS ||
                  c.y < 0 ||
                  c.y >= ROWS ||
                  v[c.y][c.x] ||
                  board[c.y][c.x] !== color
                )
                  continue;
                v[c.y][c.x] = true;
                group.push(c);
                q.push(
                  { x: c.x + 1, y: c.y },
                  { x: c.x - 1, y: c.y },
                  { x: c.x, y: c.y + 1 },
                  { x: c.x, y: c.y - 1 },
                );
              }
              if (group.length >= 4) matched.push(...group);
            }
          }
        }
        return { matches: matched };
      }

      // --- 入力・システム処理 (1の長押し + 2のポインター) ---
      function startMove(dx) {
        if (!gameRunning || isPaused || isProcessing) return;
        if (canMove(activePuyo, dx, 0)) {
          activePuyo.x += dx;
          playSE(se.move);
          draw();
        }
        clearInterval(moveRepeatTimer);
        moveRepeatTimer = setInterval(() => {
          if (canMove(activePuyo, dx, 0)) {
            activePuyo.x += dx;
            playSE(se.move);
            draw();
          }
        }, 120);
      }

      const setupBtn = (id, fn, isMove = false, dx = 0) => {
        const el = document.getElementById(id);
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (isMove) startMove(dx);
          else fn();
        });
        el.addEventListener("pointerup", () => clearInterval(moveRepeatTimer));
        el.addEventListener("pointerleave", () =>
          clearInterval(moveRepeatTimer),
        );
      };

      setupBtn("m-left", null, true, -1);
      setupBtn("m-right", null, true, 1);
      setupBtn("m-rot-l", () => rotate(-1));
      setupBtn("m-rot-r", () => rotate(1));
      setupBtn("m-down", () => {
        if (activePuyo) {
          while (canMove(activePuyo, 0, 1)) activePuyo.y++;
          lockTimer = LOCK_DELAY;
          draw();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (!gameRunning || isPaused || isProcessing) return;
        if (e.key === "ArrowLeft") {
          if (canMove(activePuyo, -1, 0)) {
            activePuyo.x--;
            playSE(se.move);
          }
        }
        if (e.key === "ArrowRight") {
          if (canMove(activePuyo, 1, 0)) {
            activePuyo.x++;
            playSE(se.move);
          }
        }
        if (e.key === "ArrowDown") {
          if (canMove(activePuyo, 0, 1)) {
            activePuyo.y++;
            fallCounter = 0;
          }
        }
        if (e.key === "z" || e.key === "ArrowUp") rotate(-1);
        if (e.key === "x" || e.key === "Shift") rotate(1);
        if (e.key === " ") {
          while (canMove(activePuyo, 0, 1)) activePuyo.y++;
          lockTimer = LOCK_DELAY;
        }
        draw();
      });

      function saveScore(s) {
        const key = `puyo_ultimate_rank_${colorCount}`; // 2のキー分離移植
        let data = JSON.parse(localStorage.getItem(key) || '{"users":[]}');
        let user = data.users.find((u) => u.id === playerID);
        if (user) {
          if (s > user.highScore) user.highScore = s;
          user.name = playerName;
        } else
          data.users.push({ id: playerID, name: playerName, highScore: s });
        localStorage.setItem(key, JSON.stringify(data));
      }

      function showStartScreen() {
        initGameVars();
        document.getElementById("player-display").innerText =
          `PLAYER: ${playerName}`;
        overlay.classList.remove("hidden");
        ["login-modal", "rank-modal"].forEach((id) =>
          document.getElementById(id).classList.add("hidden"),
        );
        document.getElementById("start-modal").classList.remove("hidden");
        updateColorUI();
        draw();
      }

      function updateColorUI() {
        document.getElementById("btn4color").style.border =
          colorCount === 4 ? "2px solid #38bdf8" : "none";
        document.getElementById("btn5color").style.border =
          colorCount === 5 ? "2px solid #38bdf8" : "none";
      }

      function showChainMsg(t) {
        chainMsg.innerText = t;
        setTimeout(() => {
          if (chainMsg.innerText === t) chainMsg.innerText = "";
        }, 1200);
      }

      document.getElementById("loginBtn").onclick = () => {
        const val = document.getElementById("nickname").value.trim();
        if (val) {
          playerName = val;
          localStorage.setItem("puyoUserName", val);
          showStartScreen();
          playSE(se.btn);
        }
      };
      document.getElementById("playBtn").onclick = () => {
        overlay.classList.add("hidden");
        gameRunning = true;
        waitingForStart = false;
        playSE(se.btn);
        gameLoop();
      };
      document.getElementById("btn4color").onclick = () => {
        colorCount = 4;
        localStorage.setItem("puyoColorCount", 4);
        updateColorUI();
        playSE(se.btn);
        initGameVars();
        draw();
      };
      document.getElementById("btn5color").onclick = () => {
        colorCount = 5;
        localStorage.setItem("puyoColorCount", 5);
        updateColorUI();
        playSE(se.btn);
        initGameVars();
        draw();
      };
      document.getElementById("pauseBtn").onclick = () => {
        isPaused = !isPaused;
        if (!isPaused) gameLoop();
        playSE(se.btn);
        draw();
      };
      document.getElementById("resetBtn").onclick = () => {
        if (confirm("Reset?")) showStartScreen();
      };
      document.getElementById("changeNameBtn").onclick = () => {
        document.getElementById("start-modal").classList.add("hidden");
        document.getElementById("login-modal").classList.remove("hidden");
      };
      document.getElementById("startRankBtn").onclick = () => {
        playSE(se.rank);
        const key = `puyo_ultimate_rank_${colorCount}`;
        let data = JSON.parse(localStorage.getItem(key) || '{"users":[]}');
        let sorted = data.users
          .sort((a, b) => b.highScore - a.highScore)
          .slice(0, 10);
        let html = `<table><tr><th>Rank</th><th>Name</th><th>Score</th></tr>`;
        sorted.forEach(
          (u, i) =>
            (html += `<tr class="${u.id === playerID ? "highlight" : ""}"><td>${i + 1}</td><td>${u.name}</td><td>${u.highScore}</td></tr>`),
        );
        document.getElementById("rank-list").innerHTML = html + `</table>`;
        document.getElementById("rank-title").innerText =
          `${colorCount} COLORS Top 10`;
        document.getElementById("start-modal").classList.add("hidden");
        document.getElementById("rank-modal").classList.remove("hidden");
      };
      document.getElementById("backBtn").onclick = () => {
        showStartScreen();
        playSE(se.btn);
      };

      // --- スタートアップ ---
      playerName = localStorage.getItem("puyoUserName");
      playerID = localStorage.getItem("puyoUserID") || "UID-" + Date.now();
      localStorage.setItem("puyoUserID", playerID);
      if (playerName) showStartScreen();
      else {
        overlay.classList.remove("hidden");
        document.getElementById("login-modal").classList.remove("hidden");
      }
    </script>
  </body>
</html>
