<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせフォーム</title>
  </head>
  <body>
    <h1>お問い合わせフォーム</h1>
    <form action="#" method="post">
      <dl>
        <dt><label for="username">お名前</label></dt>
        <dd><input id="username" type="text" name="username" required /></dd>
        <dt><label for="email">メールアドレス</label></dt>
        <dd><input id="email" type="text" name="email" required /></dd>
        <dt><label for="area">お住まいの地域</label></dt>
        <dd>
          <select id="area" name="area">
            <option value="" selected>選択してください</option>
            <option value="hokkido">北海道</option>
            <option value="tohoku">東北</option>
            <option value="kanto">関東</option>
            <option value="chubu">中部</option>
            <option value="kinki">近畿</option>
            <option value="shikoku">四国</option>
            <option value="kyusyu">九州</option>
            <option value="okinawa">沖縄</option>
          </select>
        </dd>
        <dt>性別</dt>
        <dd>
          <label
            ><input
              type="radio"
              name="gender"
              value="male"
              checked
            />男性</label
          >
          <label><input type="radio" name="gender" value="female" />女性</label>
        </dd>
        <dt><label for="contents">お問い合わせ内容 </label></dt>
        <dd>
          <select name="request">
            <label
              ><option value="1page">ホームページ作成（1ページ）</option></label
            >
            <option value="3~5page">
              ホームページ作成（3〜5ページ
            </option></select
          ><br />
          <textarea id="contents" name="contents" required></textarea>
        </dd>
        <dt>
          <label for="privacy"
            ><a href="privacy.html">プライバシーポリシー</a>に同意する</label
          >
        </dt>
        <dd>
          <input
            id="privacy"
            type="checkbox"
            name="privacy"
            value="1"
            required
          />
        </dd>
        <input type="submit" name="submit" value="送信" />
      </dl>
    </form>
    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSf_PXAvW6xvpSvxLJuw7Dgt_sQOVX_smjOa0mbYTYKSX7Kccw/viewform?usp=header"
      >アンケートのご協力をお願いします！！！</a
    >
  </body>
</html>
